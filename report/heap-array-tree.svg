<text x="490" y="84" font-size="12.5" fill="#24292f" font-weight="600">인덱스 규칙 (0부터)</text>
<text x="490" y="103" font-size="12.5" fill="#24292f" font-weight="400">왼쪽 자식  = 2i + 1</text>
<text x="490" y="122" font-size="12.5" fill="#24292f" font-weight="400">오른쪽 자식 = 2i + 2</text>
<text x="490" y="141" font-size="12.5" fill="#24292f" font-weight="400">부모       = (i − 1) / 2</text>
<text x="490" y="179" font-size="12.5" fill="#24292f" font-weight="600">예) i = 1 (값 9)</text>
<text x="490" y="198" font-size="12.5" fill="#24292f" font-weight="400">자식 3, 4 → 값 8, 3</text>
<text x="490" y="217" font-size="12.5" fill="#24292f" font-weight="400">부모 0 → 값 10</text>
<text x="490" y="255" font-size="12.5" fill="#24292f" font-weight="600">높이 = ⌊log₂ n⌋ = 3</text>
<text x="490" y="274" font-size="12.5" fill="#24292f" font-weight="400">→ siftDown 한 번 ≤ 3층</text>
